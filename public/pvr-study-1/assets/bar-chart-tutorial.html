<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Two-Bar Chart Stimulus</title>
    <script src="../../revisitUtilities/revisit-communicate.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      input,
      button,
      label,
      div,
      span {
        font-family: inherit;
      }

      #viewport {
        width: 500px;
        height: 500px;
        overflow-y: auto;
        overflow-x: hidden;
        border: 1px solid #cccccc;
        box-sizing: border-box;
        margin: 0 auto;
      }

      #viewport::-webkit-scrollbar {
        width: 0;
        height: 0;
      }

      #viewport {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      #chartArea {
        width: 500px;
        position: relative;
        box-sizing: border-box;
        background-color: #ffffff;
        background-repeat: repeat;
        background-position: left top;
      }

      .bar {
        position: absolute;
        bottom: 5px;
        width: 50px;
      }

      #shortBar {
        left: 200px;
        background: #ffffff;
        border: 1px solid #000000;
      }

      #tallBar {
        left: 260px;
        background: #ffffff;
        border: 1px solid #000000;
      }

      #scrollHint {
        position: absolute;
        left: 320px;
        bottom: 15px;
        font-size: 16px;
        color: #202020;
        padding: 4px 6px;
      }

      #controls {
        width: 500px;
        margin: 8px auto 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      #submitHint {
        width: 500px;
        margin: 8px auto 0;
        font-size: 16px;
      }

      #submitAnswer {
        padding: 6px 12px;
      }

      #feedback {
        width: 500px;
        margin: 8px auto 0;
        min-height: 22px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="viewport">
      <div id="chartArea">
        <div id="shortBar" class="bar" aria-label="Shorter bar"></div>
        <div id="tallBar" class="bar" aria-label="Taller bar"></div>
        <div id="scrollHint">Please scroll to top</div>
      </div>
    </div>
    <div id="controls">
      <label for="integerAnswer">Enter your estimate (integer):</label>
      <input id="integerAnswer" type="number" step="1" />
      <button id="submitAnswer" type="button">Submit answer</button>
    </div>
    <div id="submitHint">Press enter or click the button to submit your estimate.</div>
    <div id="feedback"></div>
  </body>
  <script type="module">
    import { generateTextureBackground } from '../textureGenerator.js';

    Revisit.onDataReceive((data) => {
      const taskID = 'barChart';
      const viewportHeight = 500;
      const viewportWidth = 500;
      const topMargin =  10;
      const scaleFactor = Number(data.scaleFactor ?? 1);
      const tallToShortRatio = Number(data.ratio);

      const clampedScaleFactor = Number.isFinite(scaleFactor) && scaleFactor > 0 ? scaleFactor : 1;
      const clampedRatio = Number.isFinite(tallToShortRatio) && tallToShortRatio > 0 ? tallToShortRatio : 2;

      const drawableHeight = viewportHeight - topMargin;
      const tallBarHeight = clampedScaleFactor * drawableHeight;
      const shortBarHeight = tallBarHeight / clampedRatio;
      const chartHeight = Math.max(viewportHeight, tallBarHeight + topMargin);

      const viewport = document.getElementById('viewport');
      const chartArea = document.getElementById('chartArea');
      const shortBar = document.getElementById('shortBar');
      const tallBar = document.getElementById('tallBar');
      const scrollHint = document.getElementById('scrollHint');
      const submitAnswer = document.getElementById('submitAnswer');
      const integerAnswer = document.getElementById('integerAnswer');
      const feedback = document.getElementById('feedback');
      const mustReachTop = clampedScaleFactor > 1;
      const correctAnswer = Math.round(clampedRatio);

      chartArea.style.width = `${viewportWidth}px`;
      chartArea.style.height = `${chartHeight}px`;
      shortBar.style.height = `${shortBarHeight}px`;
      tallBar.style.height = `${tallBarHeight}px`;
      chartArea.style.backgroundImage = `url("${generateTextureBackground({
        width: viewportWidth,
        height: chartHeight,
      })}")`;

      const trialStartTime = Date.now();
      const scrollMetrics = {
        firstScrollTime: null,
        lastScrollTime: null,
        reachedTopAt: null,
        totalScrollDistance: 0,
        numDirectionChanges: 0,
        scrollEventCount: 0,
      };
      let lastScrollTop = null;
      let lastDirection = 0;

      const isAtTop = () => viewport.scrollTop <= 1;

      const trackScroll = () => {
        if (lastScrollTop === null) {
          lastScrollTop = viewport.scrollTop;
          return;
        }
        const delta = viewport.scrollTop - lastScrollTop;
        if (delta === 0) return;

        const elapsed = Date.now() - trialStartTime;
        scrollMetrics.scrollEventCount += 1;
        scrollMetrics.totalScrollDistance += Math.abs(delta);
        if (scrollMetrics.firstScrollTime === null) {
          scrollMetrics.firstScrollTime = elapsed;
        }
        scrollMetrics.lastScrollTime = elapsed;

        const direction = delta > 0 ? 1 : -1;
        if (lastDirection !== 0 && lastDirection !== direction) {
          scrollMetrics.numDirectionChanges += 1;
        }
        lastDirection = direction;

        if (scrollMetrics.reachedTopAt === null && isAtTop()) {
          scrollMetrics.reachedTopAt = elapsed;
        }

        lastScrollTop = viewport.scrollTop;
      };

      const updateScrollState = () => {
        const canAnswer = !mustReachTop || isAtTop();
        const rawInput = integerAnswer.value.trim();
        const parsed = Number(rawInput);
        const hasIntegerInput = rawInput !== '' && Number.isInteger(parsed);
        scrollHint.style.display = mustReachTop && !isAtTop() ? 'block' : 'none';
        submitAnswer.disabled = !hasIntegerInput || !canAnswer;
      };

      const postAnswer = (answerValue) => {
        feedback.textContent = `The true ratio is ${correctAnswer}.`;
        Revisit.postAnswers({
          [taskID]: answerValue,
          scrollMetrics,
        });
      };

      submitAnswer.onclick = () => {
        const rawInput = integerAnswer.value.trim();
        const parsed = Number(rawInput);
        if (rawInput === '' || !Number.isInteger(parsed)) {
          return;
        }
        if (mustReachTop && !isAtTop()) {
          return;
        }
        postAnswer(parsed);
      };

      integerAnswer.onkeydown = (event) => {
        if (event.key === 'Enter' && !submitAnswer.disabled) {
          event.preventDefault();
          submitAnswer.click();
        }
      };

      viewport.onscroll = () => {
        trackScroll();
        updateScrollState();
      };
      integerAnswer.oninput = updateScrollState;
      viewport.scrollTop = Math.max(0, chartHeight - viewportHeight);
      updateScrollState();
    });
  </script>
</html>
